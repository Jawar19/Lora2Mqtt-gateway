<!DOCTYPE html>
<html>
<head>
    <title>Pico2 W Wi-Fi Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        select, input[type="password"], button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #28a745; color: white; border: none; cursor: pointer; }
        .btn-rescan { background-color: #007bff; color: white; border: none; cursor: pointer; }
        .status { font-size: 0.9em; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Wi-Fi Configuration</h2>
        <p class="status">Status: <!--#wifi_status--></p>
        
        <form action="/wifi_connect.cgi" method="get">
            <label for="ssid">Select Network:</label>
            <select name="ssid" id="ssid">
                <!--#wifi_list-->
            </select>
            
            <label for="pwd">Password:</label>
            <input type="password" name="pwd" id="pwd" placeholder="Enter password">
            
            <button type="submit" class="btn-submit">Connect</button>
        </form>

        <form action="/wifi_rescan.cgi" method="get">
            <button type="submit" class="btn-rescan">Rescan Networks</button>
        </form>
    </div>
</body>
</html>
