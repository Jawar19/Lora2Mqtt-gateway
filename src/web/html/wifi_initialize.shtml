<!DOCTYPE html>
<html>
<head>
    <title>Pico2 W Wi-Fi Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Wi-Fi Configuration</h2>
        <div class="status">
            Select a network and enter the password to connect the gateway to the internet.
        </div>
        
        <form action="/wifi_connect.cgi" method="get">
            <label for="ssid">Select Network</label>
            <select name="ssid" id="ssid">
                <!--#wifi_list-->
            </select>
            
            <label for="pwd">Password</label>
            <input type="password" name="pwd" id="pwd" placeholder="Enter password" required>
            
            <button type="submit" class="btn btn-connect">Connect Gateway</button>
        </form>
        <footer>
            LoRa2MQTT Gateway &bull; Pico2 W
        </footer>
    </div>
</body>
</html>
