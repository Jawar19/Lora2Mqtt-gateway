  <script>
      // Wrapping in quotes makes it a string "1" or "0"
      var isSetupRaw = "<!--#setup_flag-->";
      
      console.log("Raw SSI Value from Pico:", isSetupRaw);

      // Convert string to a number for the check
      if (parseInt(isSetupRaw) === 1) {
          console.log("Redirecting to setup...");
          window.location.href = "/wifi_initialize.shtml";
      }
    </script>   
    <div class="card">
        <h1>LoRa Gateway</h1>
        <hr>
        <p>Listening for LoRa packets...</p>
    </div>

</body>
